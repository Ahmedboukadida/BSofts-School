name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Backend CI (Prisma, NestJS Build & Vitest Unit Tests)
  # ============================================================================
  backend-ci:
    name: Backend Lint, Build & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Compile Backend TypeScript
        run: npm run build

      - name: Run Vitest Unit Tests
        run: npm test

  # ============================================================================
  # Job 2: Frontend CI (Typecheck & Next.js Production Build)
  # ============================================================================
  frontend-ci:
    name: Frontend Typecheck & Next.js Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Static Type Check (tsc)
        run: npx tsc --noEmit

      - name: Compile Next.js 16 Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3025/api
          NEXT_TELEMETRY_DISABLED: '1'

  # ============================================================================
  # Job 3: Docker Images Build Verification
  # ============================================================================
  docker-verify:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: bsofts-school-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: bsofts-school-frontend:test
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3025/api
