# ==============================================================================
# BSofts-School — Unified Production Docker Compose Stack
# Multi-tenant School Management & SaaS Platform
# Services: Redis 7, NestJS Backend, Next.js Frontend (Uses Local Host PostgreSQL)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Redis 7 In-Memory Cache & Session Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bsofts_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - bsofts-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # NestJS Backend API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bsofts_backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3025
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:admin@host.docker.internal:5432/bsoftsschool?schema=public}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-bsofts-production-super-secret-key-change-in-env-2026}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3026}
      CORS_ORIGIN: http://localhost:3026,http://localhost:3025
    ports:
      - "3025:3025"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bsofts-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3025/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # Next.js 16 Frontend Dashboard & Client Portal
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3025/api}
    container_name: bsofts_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3026
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3025/api}
    ports:
      - "3026:3026"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bsofts-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3026/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

# ------------------------------------------------------------------------------
# Persistent Storage Volumes & Internal Network
# ------------------------------------------------------------------------------
volumes:
  redis_data:
    driver: local

networks:
  bsofts-network:
    driver: bridge
